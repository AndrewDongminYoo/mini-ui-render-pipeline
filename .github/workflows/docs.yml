name: Documentation & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Convert coverage to LCOV
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=lib

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html --quiet --no-function-coverage

      - name: Generate API documentation
        run: dart doc --output doc/api

      - name: Create landing page
        run: |
          mkdir -p public/{coverage,doc}/
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Mini UI Render Pipeline - Documentation</title>
              <style>
                * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                }
                body {
                  font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
                    sans-serif;
                  line-height: 1.6;
                  color: #24292e;
                  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 20px;
                }
                .container {
                  max-width: 800px;
                  background: white;
                  border-radius: 12px;
                  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                  padding: 48px;
                }
                h1 {
                  font-size: 2.5em;
                  margin-bottom: 0.5em;
                  color: #667eea;
                }
                .subtitle {
                  font-size: 1.2em;
                  color: #586069;
                  margin-bottom: 2em;
                }
                .cards {
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 20px;
                  margin-top: 32px;
                }
                .card {
                  padding: 24px;
                  border: 2px solid #e1e4e8;
                  border-radius: 8px;
                  text-decoration: none;
                  color: inherit;
                  transition: all 0.2s;
                }
                .card:hover {
                  border-color: #667eea;
                  transform: translateY(-2px);
                  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
                }
                .card-icon {
                  font-size: 2em;
                  margin-bottom: 12px;
                }
                .card-title {
                  font-size: 1.3em;
                  font-weight: 600;
                  margin-bottom: 8px;
                }
                .card-desc {
                  color: #586069;
                  font-size: 0.95em;
                }
                .footer {
                  margin-top: 48px;
                  padding-top: 24px;
                  border-top: 1px solid #e1e4e8;
                  text-align: center;
                  color: #586069;
                  font-size: 0.9em;
                }
                .footer a {
                  color: #667eea;
                  text-decoration: none;
                }
                .footer a:hover {
                  text-decoration: underline;
                }
                @media (max-width: 600px) {
                  .cards {
                    grid-template-columns: 1fr;
                  }
                  .container {
                    padding: 32px 24px;
                  }
                  h1 {
                    font-size: 2em;
                  }
                }
              </style>
            </head>
            <body>
              <div class="container">
                <h1>📚 Mini UI Render Pipeline</h1>
                <p class="subtitle">
                  UI 렌더링 시스템의 핵심 개념을 구현한 교육용 프로젝트
                </p>

                <div class="cards">
                  <a href="./coverage/html/index.html" class="card">
                    <div class="card-icon">📊</div>
                    <div class="card-title">Test Coverage</div>
                    <div class="card-desc">
                      217개의 테스트와 커버리지 리포트를 확인하세요
                    </div>
                  </a>

                  <a href="./doc/api/index.html" class="card">
                    <div class="card-icon">📖</div>
                    <div class="card-title">API Documentation</div>
                    <div class="card-desc">전체 API 레퍼런스와 사용 가이드</div>
                  </a>
                </div>

                <div class="footer">
                  <p>
                    <a
                      href="https://github.com/AndrewDongminYoo/apr-app-assignment"
                      target="_blank"
                    >
                      GitHub Repository
                    </a>
                    |
                    <a
                      href="https://github.com/AndrewDongminYoo/apr-app-assignment/blob/main/README.md"
                      target="_blank"
                    >
                      README
                    </a>
                  </p>
                  <p style="margin-top: 8px">Made with ❤️ by Dongmin Yu</p>
                </div>
              </div>
            </body>
          </html>
          EOF

      - name: Copy documentation to public directory
        run: |
          cp -r coverage/html public/coverage/html
          cp -r doc/api public/doc/api

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
