name: mini_ui
description: A UI render pipeline system that processes tree structures and state change events to determine structure changes, layout recomputation, and paint order.
version: 1.1.0
repository: https://github.com/AndrewDongminYoo/apr-app-assignment

environment:
  sdk: ^3.10.7

# Add regular dependencies here.
dependencies:
  # No runtime dependencies - pure Dart implementation

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  import_sorter: ^4.6.0

scripts:
  bootstrap:
    (description): Initializes the project by installing dependencies and formatting code.
    (scripts):
      - dart pub get
      - $format

  format:
    (description): Applies automated fixes, sorts imports, and formats the codebase to ensure consistent code quality.
    (scripts):
      - dart fix --apply
      - dart format --line-length 120 .
      - dart run import_sorter:main -e

  test:
    (description): Runs all tests in the project with coverage enabled.
    (scripts):
      - dart test --coverage-path=coverage/lcov.info --concurrency=4 --test-randomize-ordering-seed=random

  posttest:
    (description): Generates a coverage report from the test coverage data.
    (scripts):
      - genhtml coverage/lcov.info -o coverage/ --quiet --no-function-coverage --no-branch-coverage --keep-description
