name: mini_ui
description: A UI render pipeline system that processes tree structures and state change events to determine structure changes, layout recomputation, and paint order.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.10.7

# Add regular dependencies here.
dependencies:
  json_annotation: ^4.10.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

scripts:
  bootstrap:
    (description): Initializes the project by generating necessary code, sorting imports, applying fixes, and formatting.
    (scripts):
      - dart pub get
      - $generate
      - $format

  generate:
    (description): Runs code generation builders and sorts imports to set up project files.
    (scripts):
      - dart run build_runner build --delete-conflicting-outputs

  format:
    (description): Applies automated fixes, sorts imports, and formats the codebase to ensure consistent code quality.
    (scripts):
      - dart fix --apply
      - dart format --line-length 120 .
